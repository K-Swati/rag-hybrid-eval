name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Run the benchmark
        run: |
          python -m rag_eval db init --admin-url "$TEST_ADMIN_URL" --reset
          DATABASE_URL=postgresql://rag_reader:rag_reader@localhost:5432/icecream python -m rag_eval eval
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports/
