services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS: hashing        # switch to "openai" and set OPENAI_API_KEY for semantic embeddings
      GENERATOR: extractive      # switch to "openai" for LLM answers
    depends_on: [qdrant]
